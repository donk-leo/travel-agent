project: p01_scenic
title: 景区指南数据采集与预处理（三景区）
owner: 三人各自负责一景区
reviewer: 交叉复核（长隆↔武功山↔白云山）
status: in_progress
version_tag: ""          # 三份齐全后填 v0.1-p01

inputs:
  - source: 公开网页（官网 / 游记平台）
    note: 官方路线必须是"路线页"，不是入园须知/门票页/景点介绍首页

outputs:
  - path: scenic/changlong/data/processed/changlong_guides.csv
    schema: standards/schema_scenic.json
    owner: HappinessJo
  - path: scenic/baiyunshan/data/processed/baiyunshan_guides.csv
    schema: standards/schema_scenic.json
    owner: 成员3
  - path: scenic/wugongshan/data/processed/wugongshan_guides.csv
    schema: standards/schema_scenic.json
    owner: T0coke
  - path: 各景区 outputs/质量检查报告.md
  - path: 各景区 report/*.docx

checks:
  - python checks/check_scenic.py scenic/changlong/data/processed/changlong_guides.csv
  - python checks/check_scenic.py scenic/baiyunshan/data/processed/baiyunshan_guides.csv
  - python checks/check_scenic.py scenic/wugongshan/data/processed/wugongshan_guides.csv

frozen:
  - doc_id（只增不减）
  - clean_content（下游所有项目的位置基准）

acceptance:
  - 每景区官方路线 ≥ 1 条，且为真实路线页
  - 每景区有效游客游记 ≥ 3 篇（建议 5）
  - 24 列齐全，clean_hash 无重复
  - 三份能被 scenic/wugongshan/src/merge_group.py 合并成功

notes: |
  长隆由本地历史数据集转换（scenic/changlong/src/export_standard.py）。
  白云山官网游览路线在 https://www.baiyunshan.com.cn/bys/lytj/ （A/B/C 三线）。
  武功山已交付：14 条（官方 6 + 游记 8，1 篇图片帖标 is_valid=False）。
