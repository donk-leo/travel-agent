  - 系统 Prompt 的关键约束（必须基于图谱查询）

acceptance:
  - 回答基于图谱查询，轨迹中有 tool_call 与 observation
  - 至少 3 类场景测试（老人/亲子/情侣 × 一天/两天）
  - 无匹配/信息不足/冲突约束有回退或追问
  - 提供一条完整示范（约束解析 → 工具调用 → 行程生成）
  - 密钥走 .env，仓库只有 .env.example

notes: |
  不允许把整张图塞进 Prompt 代替工具调用——那是项目 7 明确的失分点。
  真实模型 8 个案例与流程回归结果见项目七 outputs/tests.md；已有失败现象和限制需复核。
  v1.2 明确 get_route_candidates 分组接口及返回字段格式，需组内确认；P6 图谱未修改。
  景区简称、子园区范围、重复路线、多日分天与实时信息为待优化项，详见实验报告。
  reviewer HappinessJo 尚未确认；复核完成前不得标为 done 或创建正式交付标签。
